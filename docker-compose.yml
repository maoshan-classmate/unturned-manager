# unturned-manager Docker Compose
# 单服务：panel（后端 + 前端静态托管 + SteamCMD + U3DS 运行环境一体镜像）
#
# 用法：
#   1. cp .env.example .env      # 填 JWT_SECRET / ENCRYPTION_KEY / ADMIN_PASSWORD
#   2. docker compose up -d --build
#
# 三个密钥/密码带默认值仅供快速启动——生产必须用宿主 .env 覆盖。
services:
  panel:
    build: .
    container_name: unturned-manager
    restart: unless-stopped
    environment:
      NODE_ENV: production
      SERVER_PORT: ${SERVER_PORT:-3001}
      HOST: ${HOST:-0.0.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      # ⚠️ 默认值仅供快速启动/开发。生产必须用宿主 .env 覆盖。
      JWT_SECRET: ${JWT_SECRET:-7f3a9b2e4d1c8f6a0e5b3d9c2a7f4e1b8d6c0a3f5e9b2d7c4a1f8e6b0d3c9a5f}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-c2VjdXJlLXJhbmRvbS1rZXktZm9yLWVuYw==}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-123456}
      DB_PATH: /data/unturned-manager.db
      DATA_DIR: /data
      INSTALL_DIR: /opt/unturned
      STEAMCMD_DIR: ${STEAMCMD_DIR:-/opt/steamcmd}
      # 出站代理——填入即生效，留空直连；容器内 127.0.0.1 是容器自身，宿主机代理用局域网 IP
      # HTTP_PROXY: http://192.168.2.9:7890
      # HTTPS_PROXY: http://192.168.2.9:7890
    ports:
      - "3020:3001"
      # U3DS 默认端口（多实例需追加映射）
      - "28015:27015/udp"
      - "28016:27016/udp"
      - "25545:25545"
    volumes:
      - ./data:/data
      - ./opt/unturned:/opt/unturned
      - ./steamcmd:/opt/steamcmd